name: Publish site to gh-pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare public directory
        run: |
          rm -rf public || true
          mkdir -p public
          rsync -av --exclude='.git' --exclude='.github' --exclude='public' ./ public/
          ls -la public

      - name: Publish to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Create an orphan branch with the public contents and push it to gh-pages
          git checkout --orphan gh-pages-temp
          git rm -rf . || true
          cp -R public/. ./ || true
          git add -A
          git commit -m "Publish site to gh-pages (from $GITHUB_SHA)" || true

          # Push to gh-pages (force) using the provided token
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}" HEAD:gh-pages

          # Cleanup: switch back to the workflow default state
          git checkout -f $GITHUB_SHA || true
          git branch -D gh-pages-temp || true

      - name: Note for Cloudflare Pages
        run: |
          echo "Published static site to gh-pages. Configure Cloudflare Pages to build from the 'gh-pages' branch and set the build command and deploy command to empty so Pages serves these static files directly (wrangler not required)."
